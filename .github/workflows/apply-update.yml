name: Apply Update and Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip update over project
        run: |
          unzip -o omniai-app-update.zip
          rm omniai-app-update.zip
          ls android/app/src/main/java/com/owner/omniai/data/Api.kt android/app/src/main/java/com/owner/omniai/ui/Screens.kt

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply v2 update: Retrofit fixes + voice + Arabic" || echo "nothing to commit"
          git push

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then ./gradlew assembleDebug --no-daemon;
          else gradle assembleDebug --no-daemon; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniAI-debug-apk-v2
          path: android/app/build/outputs/apk/debug/app-debug.apk

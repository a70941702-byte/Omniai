name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-llm.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Compile backend
        run: python -m py_compile app/main.py app/api/routes.py app/database.py app/security/policy.py app/backup/manager.py

      - name: Run tests
        env:
          OMNI_OWNER_TOKEN: test-owner-token
        run: pytest -q tests

      - name: Backend smoke load test
        env:
          OMNI_OWNER_TOKEN: test-owner-token
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/omniai-ci.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/readyz >/dev/null || (cat /tmp/omniai-ci.log && exit 1)
          python scripts/load_smoke.py --base-url http://127.0.0.1:8000 --owner-token test-owner-token --requests 12 --concurrency 4
